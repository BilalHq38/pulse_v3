name: Pulse Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pyright
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check backend/ --select E,F,W --output-format github

      - name: Ruff format check
        run: ruff format --check backend/

  syntax:
    name: Python Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall backend/ -q

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          ENVIRONMENT: test
        run: pytest backend/tests -q

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build

  whatsapp-bridge-tests:
    name: WhatsApp Bridge Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/whatsapp_bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/whatsapp_bridge/package-lock.json

      - run: npm ci
      - run: npm test

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for validation
        run: |
          cat > .env << 'EOF'
          JWT_SECRET=ci-test-secret-that-is-long-enough-for-validation
          DATABASE_URL=postgresql://pulse:pulse@localhost:5432/pulse_engine
          POSTGRES_USER=pulse
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=pulse_engine
          INTERNAL_SERVICE_SECRET=ci-internal-secret-long-enough
          DEFAULT_TENANT_ID=ci_tenant
          DEFAULT_TENANT_API_KEY=ci-api-key-long-enough
          DEFAULT_TENANT_SALT=ci-salt-value
          TENANT_SALTS=ci_tenant:ci-salt-value
          IDENTITY_ADMIN_EMAIL=admin@ci.test
          IDENTITY_ADMIN_PASSWORD=ci-admin-password-long
          META_WEBHOOK_SECRET=ci-meta-webhook-secret
          WEB_CHAT_WEBHOOK_SECRET=ci-webchat-secret
          EXTERNAL_WEBHOOK_SECRET=ci-external-secret
          WHATSAPP_BRIDGE_SECRET=ci-bridge-secret
          WHATSAPP_WEBHOOK_SECRET=ci-wa-webhook-secret
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          # Check for common secret patterns in Python files
          if grep -rn "password\s*=\s*['\"][^'\"]*['\"]" backend/ --include="*.py" \
             | grep -v "test" | grep -v "#" | grep -v "environ" | grep -v "get(" | grep -v "example" | grep -v "placeholder"; then
            echo "::warning::Potential hardcoded secrets found"
          fi
