name: Pulse Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pyright
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check backend/ --select E,F,W --output-format github

      - name: Ruff format check
        run: ruff format --check backend/

  syntax:
    name: Python Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall backend/ -q

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for validation
        run: |
          cat > .env << 'EOF'
          JWT_SECRET=ci-test-secret-that-is-long-enough-for-validation
          DATABASE_URL=postgresql://pulse:pulse@localhost:5432/pulse_engine
          POSTGRES_USER=pulse
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=pulse_engine
          INTERNAL_SERVICE_SECRET=ci-internal-secret-long-enough
          DEFAULT_TENANT_ID=ci_tenant
          DEFAULT_TENANT_API_KEY=ci-api-key-long-enough
          DEFAULT_TENANT_SALT=ci-salt-value
          TENANT_SALTS=ci_tenant:ci-salt-value
          IDENTITY_ADMIN_EMAIL=admin@ci.test
          IDENTITY_ADMIN_PASSWORD=ci-admin-password-long
          META_WEBHOOK_SECRET=ci-meta-webhook-secret
          WEB_CHAT_WEBHOOK_SECRET=ci-webchat-secret
          EXTERNAL_WEBHOOK_SECRET=ci-external-secret
          WHATSAPP_BRIDGE_SECRET=ci-bridge-secret
          WHATSAPP_WEBHOOK_SECRET=ci-wa-webhook-secret
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint, syntax]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pulse_test
          POSTGRES_PASSWORD: pulse_test_password
          POSTGRES_DB: pulse_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pulse_test:pulse_test_password@localhost:5432/pulse_test_db
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      JWT_SECRET: test-jwt-secret-that-is-long-enough-for-testing
      INTERNAL_SERVICE_SECRET: test-internal-secret
      ALLOW_UNSIGNED_WEB_CHAT_WIDGET: "true"
      POSTGRES_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -x --timeout=60 -q --tb=short
        continue-on-error: false

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          # Check for common secret patterns in Python files
          if grep -rn "password\s*=\s*['\"][^'\"]*['\"]" backend/ --include="*.py" \
             | grep -v "test" | grep -v "#" | grep -v "environ" | grep -v "get(" | grep -v "example" | grep -v "placeholder"; then
            echo "::warning::Potential hardcoded secrets found"
          fi
