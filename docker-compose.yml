    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  whatsapp-bridge-auth:
  uploads-data:
  fastembed-cache:

networks:
  pulse-network:
