      PORT: 8001
      DB_SCHEMA: auth_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
    expose:
      - "8001"
    logging: *default-logging
    deploy:
      resources:
