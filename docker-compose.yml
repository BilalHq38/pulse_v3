x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  APP_ENV: ${APP_ENV:-development}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  # Local dev: set POSTGRES_SSLMODE=disable in .env if your postgres container has no certs
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
  PGSSLMODE: ${POSTGRES_SSLMODE:-require}
  # Browser URL for Stripe return URLs and OAuth redirects when Origin is missing (e.g. GET callbacks).
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # Public-facing API gateway URL — used to build absolute product image URLs
  # for outbound channels (WhatsApp/Meta require a publicly accessible URL).
  # Change to your real domain in production.
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/1}
  RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/2}
  BACKGROUND_QUEUE_URL: ${BACKGROUND_QUEUE_URL:-redis://redis:6379/3}
  BACKGROUND_QUEUE_ENABLED: ${BACKGROUND_QUEUE_ENABLED:-true}
  BACKGROUND_QUEUE_MAX_RETRIES: ${BACKGROUND_QUEUE_MAX_RETRIES:-5}
  BACKGROUND_QUEUE_VISIBILITY_TIMEOUT: ${BACKGROUND_QUEUE_VISIBILITY_TIMEOUT:-300}
  BACKGROUND_QUEUE_JOB_TIMEOUT_SECONDS: ${BACKGROUND_QUEUE_JOB_TIMEOUT_SECONDS:-600}
  BACKGROUND_QUEUE_JOB_TTL_SECONDS: ${BACKGROUND_QUEUE_JOB_TTL_SECONDS:-86400}
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
  AUTH_SERVICE_URL: http://auth:8001
  USER_SERVICE_URL: http://user:8002
  CUSTOMER_SERVICE_URL: http://customer:8003
  LEAD_SERVICE_URL: http://lead:8004
  EMAIL_CAMPAIGN_SERVICE_URL: http://email-campaign:8013
  AI_SERVICE_URL: http://ai:8005
  ORCHESTRATOR_SERVICE_URL: http://agent-orchestrator:8009
  ANALYTICS_SERVICE_URL: http://analytics:8006
  DATA_PIPELINE_SERVICE_URL: http://data-pipeline:8012
  PRODUCT_SERVICE_URL: http://product:8007
  NOTIFICATION_SERVICE_URL: http://notification:8008
  IDENTITY_SERVICE_URL: http://identity:8010
  SUPER_ADMIN_SERVICE_URL: http://super-admin:8011
  DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:?DEFAULT_TENANT_ID is required}
  DEFAULT_TENANT_API_KEY: ${DEFAULT_TENANT_API_KEY:?DEFAULT_TENANT_API_KEY is required}
  DEFAULT_TENANT_SALT: ${DEFAULT_TENANT_SALT:?DEFAULT_TENANT_SALT is required}
  TENANT_API_KEYS: ${TENANT_API_KEYS:-}
  TENANT_SALTS: ${TENANT_SALTS:?TENANT_SALTS is required}
  IDENTITY_ADMIN_EMAIL: ${IDENTITY_ADMIN_EMAIL:?IDENTITY_ADMIN_EMAIL is required}
  IDENTITY_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?IDENTITY_ADMIN_PASSWORD is required}
  TENANT_RATE_LIMIT_PER_MINUTE: ${TENANT_RATE_LIMIT_PER_MINUTE:-1000}
  META_WEBHOOK_SECRET: ${META_WEBHOOK_SECRET:?META_WEBHOOK_SECRET is required}
  WEB_CHAT_WEBHOOK_SECRET: ${WEB_CHAT_WEBHOOK_SECRET:?WEB_CHAT_WEBHOOK_SECRET is required}
  EXTERNAL_WEBHOOK_SECRET: ${EXTERNAL_WEBHOOK_SECRET:?EXTERNAL_WEBHOOK_SECRET is required}
  # Demo / CI: set DEMO_MODE=true to seed demo users and relax onboarding + billing gates. STRIPE_OPTIONAL=true skips Stripe subscription enforcement without seeding.
  DEMO_MODE: ${DEMO_MODE:-false}
  STRIPE_OPTIONAL: ${STRIPE_OPTIONAL:-false}
  # Stripe-off self-serve trial (no DEMO_MODE): set STRIPE_ENABLED=false optionally with TRIAL_PERIOD_DAYS (default 90).
  STRIPE_ENABLED: ${STRIPE_ENABLED:-auto}
  TRIAL_PERIOD_DAYS: ${TRIAL_PERIOD_DAYS:-90}
  # WhatsApp Web (linked device) Node bridge — see service whatsapp-bridge
  WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:3001}
  WHATSAPP_BRIDGE_SECRET: ${WHATSAPP_BRIDGE_SECRET:-}
  WHATSAPP_MODE: ${WHATSAPP_MODE:-bridge}
  WHATSAPP_DEFAULT_COUNTRY: ${WHATSAPP_DEFAULT_COUNTRY:-}
  UPLOAD_STORAGE_DIR: ${UPLOAD_STORAGE_DIR:-/app/uploads}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-${STORAGE_BACKEND:-local}}
  LOCAL_ML_ENABLED: "${LOCAL_ML_ENABLED:-false}"

x-service-defaults: &service-defaults
  env_file:
    - .env
  restart: always
  networks:
    - pulse-network

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:pg16
    container_name: pulse-postgres-engine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse_engine_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pulse_engine}
      PGDATABASE: ${POSTGRES_DB:-pulse_engine}
      PGCONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
      PGPORT: 5432
      PGSSLMODE: disable
      PGUSER: ${POSTGRES_USER:-pulse_engine_app}
    command: ["postgres", "-c", "max_connections=300"]
    expose:
      - "5432"
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/sql_schema.sql:/docker-entrypoint-initdb.d/10-database-complete.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_engine_app} -d ${POSTGRES_DB:-pulse_engine}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: pulse-redis-engine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  # WhatsApp Web.js bridge (QR link device) — forwards to gateway webhooks
  whatsapp-bridge:
    <<: *service-defaults
    build:
      context: .
      dockerfile: backend/whatsapp_bridge/Dockerfile
    container_name: pulse-whatsapp-bridge
    shm_size: '256m'
    environment:
      BRIDGE_PORT: ${BRIDGE_PORT:-3001}
      PYTHON_BACKEND: ${PYTHON_BACKEND:-http://gateway:8000}
      WHATSAPP_WEBHOOK_PATH: ${WHATSAPP_WEBHOOK_PATH:-/api/webhook/meta/whatsapp}
      WHATSAPP_BRIDGE_SECRET: ${WHATSAPP_BRIDGE_SECRET:?WHATSAPP_BRIDGE_SECRET is required}
      BRIDGE_SECRET: ${WHATSAPP_BRIDGE_SECRET:?WHATSAPP_BRIDGE_SECRET is required}
      # Optional for whatsapp-web.js bridge sessions. Meta Cloud webhooks still use real tenant_meta_config/channel_settings IDs.
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      META_WEBHOOK_SECRET: ${META_WEBHOOK_SECRET:?META_WEBHOOK_SECRET is required}
      WHATSAPP_WEBHOOK_SECRET: ${META_WEBHOOK_SECRET:?META_WEBHOOK_SECRET is required}
      BRIDGE_COMPANY_ID: ${BRIDGE_COMPANY_ID:-${DEFAULT_TENANT_ID}}
      WHATSAPP_DEFAULT_COUNTRY: ${WHATSAPP_DEFAULT_COUNTRY:-}
      MY_WHATSAPP_NUMBER: ${MY_WHATSAPP_NUMBER:-}
      # Reduced from 180s — retry faster on transient Chromium/WA errors
      WWEBJS_AUTH_TIMEOUT_MS: ${WWEBJS_AUTH_TIMEOUT_MS:-60000}
      WWEBJS_READY_AFTER_INIT_TIMEOUT_MS: ${WWEBJS_READY_AFTER_INIT_TIMEOUT_MS:-60000}
      WWEBJS_INIT_MAX_ATTEMPTS: ${WWEBJS_INIT_MAX_ATTEMPTS:-3}
      WWEBJS_INIT_RETRY_BASE_DELAY_MS: ${WWEBJS_INIT_RETRY_BASE_DELAY_MS:-2000}
      WWEBJS_INIT_RETRY_MAX_DELAY_MS: ${WWEBJS_INIT_RETRY_MAX_DELAY_MS:-10000}
      BRIDGE_READY_TIMEOUT_MS: ${BRIDGE_READY_TIMEOUT_MS:-60000}
      BRIDGE_CHECK_READY_TIMEOUT_MS: ${BRIDGE_CHECK_READY_TIMEOUT_MS:-60000}
      PUPPETEER_PROTOCOL_TIMEOUT_MS: ${PUPPETEER_PROTOCOL_TIMEOUT_MS:-60000}
      PUPPETEER_NAVIGATION_TIMEOUT_MS: ${PUPPETEER_NAVIGATION_TIMEOUT_MS:-60000}
    expose:
      - "3001"
    ports:
      - "${WHATSAPP_BRIDGE_HOST_PORT:-3001}:3001"
    volumes:
      - whatsapp-bridge-auth:/app/.wwebjs_auth
    # Bridge only needs data services to be up — gateway dependency removed so
    # Chromium initializes in parallel with Python services instead of after them.
    # Webhook retries handle the case where gateway isn't ready on first message.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # wget is ~10x lighter than spawning a Node.js process for each health probe
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Express starts within 1-2s; 10s is generous for slow container boot
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  auth:
    <<: *service-defaults
    build:
      context: .
